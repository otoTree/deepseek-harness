# Keyless replay route for media projection: video is native frame-only input,
# while standalone audio and documents fall back to explicit tool-path handles.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash-vision-exp
                inputModalities: [text, video]
                videoAudioMode: visual-only
                fileInputPolicy: provider-files

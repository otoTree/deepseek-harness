            - paragraph [ref=f1e154]: 把企业接口返回的当前页记录转换为统一的组织、账号和成员关系。接口游标由调用方放入 input.page.nextCursor。
            - generic [ref=f1e155]:
              - text: 同步脚本源码
              - textbox "同步脚本源码" [ref=f1e156]: "module.exports = function transform(input) { const page = input.page ?? { items: [] } const records = Array.isArray(page.items) ? page.items : [] // 企业字段 -> 智域OS标准字段：稳定外部编号不能使用数组下标。 const organizations = records .filter(item => item.kind === 'department') .map(item => ({ externalId: String(item.dept_code), parentExternalId: item.parent_code ? String(item.parent_code) : null, name: String(item.dept_name ?? ''), kind: 'department', status: item.enabled === false ? 'suspended' : 'active' })) const users = records .filter(item => item.kind === 'employee') .map(item => ({ externalId: String(item.employee_no), email: String(item.work_email ?? '').trim().toLowerCase(), name: String(item.display_name ?? item.employee_name ?? ''), active: item.employment_status === '在职' })) const memberships = records .filter(item => item.kind === 'employee' && item.dept_code) .map(item => ({ externalId: String(item.employee_no) + '@' + String(item.dept_code), userExternalId: String(item.employee_no), organizationExternalId: String(item.dept_code), role: 'member', status: item.employment_status === '在职' ? 'active' : 'suspended' })) const pageInfo = { nextCursor: page.nextCursor ?? null, total: page.total ?? records.length } return { organizations: { items: organizations, ...pageInfo }, users: { items: users, ...pageInfo }, memberships: { items: memberships, ...pageInfo } } }"

- insert:
    - id: enterprise-console
      name: '@deepseek-ai/cordis-plugin-logger-console'
    - id: enterprise-api
      name: '@deepseek-ai/dsh-enterprise-api'
      config:
        databaseUrl: !!js process.env.ENTERPRISE_DATABASE_URL
        pluginDatabaseUrl: !!js process.env.ENTERPRISE_PLUGIN_DATABASE_URL
        authSecret: !!js process.env.ENTERPRISE_AUTH_SECRET
        encryptionKey: !!js process.env.ENTERPRISE_ENCRYPTION_KEY
        apiUrl: !!js process.env.ENTERPRISE_API_URL
        adminOrigin: !!js process.env.ENTERPRISE_ADMIN_ORIGIN
        portalOrigin: !!js process.env.ENTERPRISE_PORTAL_ORIGIN
        redisUrl: !!js process.env.ENTERPRISE_REDIS_URL
        redisKeyPrefix: !!js process.env.ENTERPRISE_REDIS_KEY_PREFIX ?? 'dsh:enterprise'
        modelRequestsPerMinute: !!js Number(process.env.ENTERPRISE_MODEL_REQUESTS_PER_MINUTE ?? '120')
        modelConcurrentCalls: !!js Number(process.env.ENTERPRISE_MODEL_CONCURRENT_CALLS ?? '8')
        modelUsageMaxEventChars: !!js Number(process.env.ENTERPRISE_MODEL_USAGE_MAX_EVENT_CHARS ?? '2097152')
        modelRequestBodyBytes: !!js Number(process.env.ENTERPRISE_MODEL_REQUEST_BODY_BYTES ?? '67108864')
        driveStagingSweepSeconds: !!js Number(process.env.ENTERPRISE_DRIVE_STAGING_SWEEP_SECONDS ?? '86400')
        driveCleanupBatch: !!js Number(process.env.ENTERPRISE_DRIVE_CLEANUP_BATCH ?? '100')
        driveCleanupIntervalMs: !!js Number(process.env.ENTERPRISE_DRIVE_CLEANUP_INTERVAL_MS ?? '60000')
        modelTaskAccepting: !!js process.env.ENTERPRISE_MODEL_TASK_ACCEPTING ?? 'true'
        modelTaskScanIntervalMs: !!js Number(process.env.ENTERPRISE_MODEL_TASK_SCAN_INTERVAL_MS ?? '1000')
        modelTaskConcurrency: !!js Number(process.env.ENTERPRISE_MODEL_TASK_CONCURRENCY ?? '4')
        modelTaskLeaseMs: !!js Number(process.env.ENTERPRISE_MODEL_TASK_LEASE_MS ?? '120000')
        modelTaskMaxAgeMs: !!js Number(process.env.ENTERPRISE_MODEL_TASK_MAX_AGE_MS ?? '86400000')
        modelTaskRetryMaxMs: !!js Number(process.env.ENTERPRISE_MODEL_TASK_RETRY_MAX_MS ?? '1800000')
        modelTaskAssetRetentionSeconds: !!js Number(process.env.ENTERPRISE_MODEL_TASK_ASSET_RETENTION_SECONDS ?? '604800')
        modelTaskAssetMaxBytes: !!js Number(process.env.ENTERPRISE_MODEL_TASK_ASSET_MAX_BYTES ?? '536870912')
        port: !!js Number(process.env.ENTERPRISE_API_PORT ?? '8787')
        loginSessionSeconds: !!js Number(process.env.ENTERPRISE_LOGIN_SESSION_SECONDS ?? '2592000')
        mode: !!js process.env.ENTERPRISE_MODE ?? 'open'
        requireEmailVerification: !!js process.env.ENTERPRISE_REQUIRE_EMAIL_VERIFICATION ?? 'false'
        smtpUrl: !!js process.env.ENTERPRISE_SMTP_URL
        mailFrom: !!js process.env.ENTERPRISE_MAIL_FROM
        reviewModelId: !!js process.env.ENTERPRISE_REVIEW_MODEL_ID
        desktopUpdatePublicKey: !!js process.env.ENTERPRISE_DESKTOP_UPDATE_PUBLIC_KEY
        desktopInstallerMaxBytes: !!js Number(process.env.ENTERPRISE_DESKTOP_INSTALLER_MAX_BYTES ?? '1073741824')
        objectStoreEndpoint: !!js process.env.ENTERPRISE_MINIO_ENDPOINT
        objectStoreAccessKey: !!js process.env.ENTERPRISE_MINIO_ACCESS_KEY
        objectStoreSecretKey: !!js process.env.ENTERPRISE_MINIO_APP_PASSWORD
        objectStoreBucket: !!js process.env.ENTERPRISE_MINIO_BUCKET ?? 'dsh-enterprise'
        host: !!js process.env.ENTERPRISE_API_HOST ?? '127.0.0.1'
